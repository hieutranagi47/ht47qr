services:
  htqrcode:
    build:
      context: ./
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
      # turn:
      #   condition: service_started
    stop_grace_period: 20s
    environment:
      # Giới hạn Concurrency (Xử lý đồng thời) và CPU
      GOMAXPROCS: "2" # Mặc định, Go sẽ lấy số CPU của máy Host làm giá trị GOMAXPROCS. Nếu bạn chạy container trên một server 64 cores nhưng chỉ giới hạn tài nguyên container là cpus: 2, Go (từ phiên bản 1.24 trở về trước) vẫn có thể hiểu nhầm là có 64 cores, dẫn đến việc tranh chấp CPU và giảm hiệu năng (CPU throttling).
      GODEBUG: "madvdontneed=1,netdns=go,gctrace=1,schedtrace=1000" # =In ra trạng thái của bộ lập lịch (Scheduler) sau mỗi X mili-giây, giúp bạn xem các Goroutine trong Echo đang phân bổ trên các luồng CPU như thế nào để debug hiện tượng nghẽn.
      GOMEMLIMIT: "900MiB" # ~ 90% of the RAM. Đặt giới hạn mềm cho tổng lượng bộ nhớ mà Go Runtime được phép dùng. Khi bộ nhớ chạm ngưỡng này, bộ thu gom rác (Garbage Collector - GC) sẽ bị kích hoạt liên tục và quyết liệt hơn để giải phóng RAM, cố gắng không để container vượt quá giới hạn và bị Docker Kill.
      GOGC: "90" # Xác định tỷ lệ phần trăm tăng trưởng của bộ nhớ heap trước khi đợt thu gom rác tiếp theo được kích hoạt (mặc định là 100).
      TZ: Asia/Ho_Chi_Minh
      # Force TURN locally so a successful game proves the relay works.
      CARO_TURN_URLS: "turn:free.expressturn.com:3478?transport=tcp,turn:free.expressturn.com:3478?transport=udp"
      CARO_TURN_USERNAME: "000000002107744556"
      CARO_TURN_PASSWORD: "mxJLG/ft6aioH97b+m7BNYTlVv4="
      CARO_ICE_TRANSPORT_POLICY: "${CARO_ICE_TRANSPORT_POLICY:-relay}"
      # Container listeners are fixed; SERVER_PORT below selects the host port.
      SERVER_PORT: "8080"
      DATABASE_BACKEND: postgres
      # Use the Compose service name, not localhost, to reach PostgreSQL.
      # Use URL-safe values for these connection-string components.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-htqrcode}:${POSTGRES_PASSWORD:-htqrcode-local}@postgres:5432/${POSTGRES_DB:-htqrcode}?sslmode=disable"
      DATABASE_URL_UNPOOLED: ""
      POSTGRES_URL: ""
      POSTGRES_URL_NON_POOLING: ""
      SERVER_GRPC_PORT: ""
      SERVER_PORT_TLS: "8443"
      SERVER_SSE_PORT: "8886"
      SERVER_SSE_PORT_TLS: "8446"
