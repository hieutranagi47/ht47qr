      - "${SERVER_PORT:-8888}:8080"
      - "${SERVER_PORT_TLS:-8443}:8443"
      - "${SERVER_SSE_PORT:-8886}:8886"
      - "${SERVER_SSE_PORT_TLS:-8446}:8446"
    volumes:
      - htqrcode-data:/app/data

  # Local development relay; use runtime-issued credentials in the browser.
  # turn:
  #   image: coturn/coturn:4.18.0-r0-alpine
  #   # Pass arguments literally (the image's wrapper evaluates them with a shell).
  #   entrypoint: ["turnserver"]
  #   command:
  #     - -n
  #     - --log-file=stdout
  #     - --listening-ip=0.0.0.0
  #     # Keep the container's real relay address: both relay-only clients reach
  #     # it through TURN. Browsers reject 127.0.0.1 as a remote ICE candidate.
  #     - --listening-port=3478
  #     - --min-port=49160
  #     - --max-port=49200
  #     - --realm=caro.local
  #     - --use-auth-secret
  #     - --static-auth-secret=${CARO_TURN_SECRET:-caro-local-development-only}
  #     - --fingerprint
  #     - --no-tls
  #     - --no-cli
  #     - --no-multicast-peers
  #   ports:
  #     - "${CARO_TURN_HOST:-127.0.0.1}:3478:3478/tcp"
  #     - "${CARO_TURN_HOST:-127.0.0.1}:3478:3478/udp"
  #     - "${CARO_TURN_HOST:-127.0.0.1}:49160-49200:49160-49200/udp"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-htqrcode}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-htqrcode-local}"
      POSTGRES_DB: "${POSTGRES_DB:-htqrcode}"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  htqrcode-data:
  postgres-data:
