openapi: 3.0.3
info:
  title: Caro room API
  version: 1.0.0
paths:
  /api/v1/rooms:
    post:
      operationId: createRoom
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Private UUIDv4 recovery key. Reuse the same key and inputs after interruption; scoped to the resolved client IP for the room lifetime.
          schema:
            type: string
            format: uuid
      description: >-
        Create a room for the server-resolved client IP. Each IP may create or
        participate in at most 50 unexpired rooms in total across WAITING and PLAYING.
        A conflicting WAITING membership returns 409 with slug waiting_room_limit_reached.
        Idempotency-Key is a private UUIDv4; reuse it with the same inputs and IP
        after interruption to retrieve the exact original room and host credential.
        Changed inputs return 409 idempotency_conflict. If the retained room has
        expired, retries return 410 idempotency_expired. Replay is guaranteed for
        the room lifetime; use a fresh key after expiry. IP identity is never
        accepted in the body or included in public responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoom'
      responses:
        '201':
          description: Room and private host reservation. Store hostToken securely; never publish it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRoom'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
    get:
      operationId: listRooms
      responses:
        '200':
          description: Unexpired public waiting rooms with one reserved slot, ordered by createdAt then id ascending.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
  /api/v1/rooms/{code}:
    parameters:
      - in: path
        name: code
        required: true
        description: Six characters from ABCDEFGHJKLMNPQRSTUVWXYZ23456789. Trimmed and uppercased.
        schema:
          type: string
    get:
      operationId: getRoom
      responses:
        '200':
          description: Public room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Safe public error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateRoom:
      type: object
      additionalProperties: false
      required: [displayName, roomType, maxGames]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        roomType:
          type: string
          enum: [PUBLIC, PRIVATE]
        maxGames:
          type: integer
          enum: [1, 3, 5, 7]
    CreatedRoom:
      type: object
      required: [room, hostReservation]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        hostReservation:
          type: object
          required: [playerId, role, hostToken]
          properties:
            playerId:
              type: string
            role:
              type: string
              enum: [PLAYER_1]
            hostToken:
              type: string
              description: Private 256-bit credential. Only waiting, unbound hosts may reconnect.
    Room:
      type: object
      required: [id, code, roomType, maxGames, status, createdAt, expiresAt, occupancy, full, joinable, players]
      properties:
        id:
          type: string
        code:
          type: string
        roomType:
          type: string
          enum: [PUBLIC, PRIVATE]
        maxGames:
          type: integer
        status:
          type: string
          enum: [WAITING, PLAYING, FINISHED]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        occupancy:
          type: integer
        full:
          type: boolean
        joinable:
          type: boolean
        players:
          type: array
          items:
            type: object
            required: [displayName, role, connected]
            properties:
              displayName:
                type: string
              role:
                type: string
              connected:
                type: boolean
    ErrorResponse:
      type: object
      required: [message, slug, details]
      properties:
        message:
          type: string
        slug:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [entity_type, entity_id, error_slug, message]
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
        error_slug:
          type: string
        message:
          type: string
