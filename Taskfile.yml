version: "3"

tasks:
  generate:
    desc: Run all code generators
    deps: [gen]

  fmt:
    cmds:
      - go tool gofumpt -l -w .

  gen:
    cmds:
      - go generate ./...
      - task: fmt

  build-wasm:
    desc: Build Caro WASM and its matching Go browser runtime before Docker embeds them
    dir: ../caro
    cmds:
      - sh ./scripts/build-wasm.sh

  docker:
    deps: [build-wasm]
    cmds:
      - docker build -f Dockerfile -t htqrcode .

  docker-up:
    desc: Build Caro WASM and start the app with PostgreSQL
    deps: [build-wasm]
    cmds:
      - docker compose up --build
